
name: Diagnose Oracle API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Diagnose API on Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu

            sudo -n python3 - <<'PY'
            import os
            import re
            import stat
            import subprocess

            def run(*args):
                return subprocess.run(
                    args,
                    capture_output=True,
                    text=True,
                    check=False,
                    timeout=30,
                )

            print("=== API SERVICE ===", flush=True)

            result = run(
                "systemctl", "show", "ai-pulse-api",
                "-p", "ActiveState",
                "-p", "SubState",
                "-p", "NRestarts",
                "-p", "ExecMainStatus",
                "-p", "Result",
            )

            allowed = {
                "ActiveState",
                "SubState",
                "NRestarts",
                "ExecMainStatus",
                "Result",
            }

            for line in result.stdout.splitlines():
                key, sep, value = line.partition("=")
                if sep and key in allowed:
                    if re.fullmatch(r"[A-Za-z0-9_-]+", value):
                        print(line)

            print("\n=== API USER AND DATABASE ACCESS ===")

            user_result = run(
                "systemctl", "show",
                "ai-pulse-api", "-p", "User", "--value",
            )
            username = user_result.stdout.strip()

            if username:
                identity = run("id", "-u", username)
                uid = identity.stdout.strip()
                if uid.isdigit():
                    print("API user UID:", uid)
            else:
                print("API runs as root (no User configured)")

            directory = "/var/lib/ai-pulse"

            try:
                info = os.stat(directory)
                print("Directory exists: yes")
                print("Directory owner UID:", info.st_uid)
                print(
                    "Directory permissions:",
                    f"{stat.S_IMODE(info.st_mode):04o}",
                )
            except FileNotFoundError:
                print("Directory exists: no")

            for filename in ("aipulse.db", "hangfire.db"):
                path = os.path.join(directory, filename)
                print(
                    filename + ":",
                    "exists" if os.path.exists(path) else "missing",
                )

            print("\n=== STARTUP ERRORS (SANITIZED) ===")

            journal = run(
                "journalctl",
                "-u", "ai-pulse-api",
                "-n", "300",
                "--no-pager",
                "-o", "cat",
            )

            if journal.returncode != 0:
                print("Unable to read journal")
                raise SystemExit(1)

            exception_pattern = re.compile(
                r"\b(?:[A-Za-z_][A-Za-z0-9_]*\.)*"
                r"[A-Za-z_][A-Za-z0-9_]*Exception\b"
            )

            sqlite_pattern = re.compile(
                r"SQLite Error \d+(?:\s*:\s*\d+)?",
                re.IGNORECASE,
            )

            known_errors = {
                "unable to open database file":
                    "SQLite cannot open database",
                "attempt to write a readonly database":
                    "SQLite database is read-only",
                "permission denied":
                    "Permission denied",
                "access denied":
                    "Access denied",
                "database is locked":
                    "SQLite database locked",
                "no such table":
                    "SQLite table missing",
                "no such file or directory":
                    "File or directory missing",
                "address already in use":
                    "Port already in use",
                "no space left on device":
                    "Disk full",
                "failed to bind":
                    "Server binding failed",
            }

            found = 0

            for line in journal.stdout.splitlines():
                findings = []

                for match in exception_pattern.finditer(line):
                    findings.append(
                        "Exception: " + match.group(0)
                    )

                for match in sqlite_pattern.finditer(line):
                    findings.append(
                        "SQLite: " + match.group(0)
                    )

                lower = line.lower()
                for phrase, description in known_errors.items():
                    if phrase in lower:
                        findings.append(description)

                if findings:
                    print(" | ".join(dict.fromkeys(findings)))
                    found += 1

            if found == 0:
                print("No recognized startup errors found")

            print("\n=== DIAGNOSIS COMPLETE ===")
            PY
