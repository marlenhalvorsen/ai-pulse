name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish AiPulse.Client
        run: dotnet publish AiPulse.Client -c Release -o publish

      - name: Verify static publish output
        run: |
          test -f publish/wwwroot/index.html
          test -f publish/wwwroot/_framework/blazor.webassembly.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.158.0 pages deploy publish/wwwroot --project-name=ai-pulse --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
